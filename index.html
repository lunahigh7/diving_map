<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="전 세계 스쿠버다이빙 포인트와 나만의 로그북" />
  <title>SCUBA MAP | Dive the world</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top"><span>◒</span> SCUBA <i>MAP</i></a>
    <nav class="nav-tabs" aria-label="주 메뉴">
      <button class="nav-tab active" data-view="explore">탐험하기</button>
      <button class="nav-tab" data-view="logbook">나의 로그북 <span id="logCount">0</span></button>
    </nav>
    <button class="mobile-menu" aria-label="메뉴">☰</button>
  </header>

  <main id="top">
    <section id="exploreView" class="view active">
      <div class="hero">
        <div><p class="eyebrow">THE BLUE PLANET · 2025</p><h1>세상의 모든<br /><em>블루</em>를 찾아서.</h1></div>
        <p class="hero-copy">다음 버디를 만날 곳, 다음 모험이 시작될 곳.<br />당신만의 다이빙 지도를 채워보세요.</p>
      </div>
      <section class="filter-bar" aria-label="다이빙 포인트 필터">
        <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="포인트, 국가, 생물 검색" /></label>
        <select id="regionFilter"><option value="">모든 지역</option><option>아시아</option><option>오세아니아</option><option>북아메리카</option><option>중앙아메리카</option><option>아프리카</option><option>유럽</option></select>
        <select id="monthFilter"><option value="">모든 시즌</option></select>
        <select id="levelFilter"><option value="">모든 난이도</option><option value="beginner">🟢 초급</option><option value="intermediate">🟡 중급</option><option value="advanced">🔴 상급</option></select>
        <button id="resetFilters" class="text-button">초기화</button>
      </section>
      <section class="creature-filter">
        <span>관심 생물</span><div id="creatureChips" class="chip-list"></div>
      </section>
      <section class="map-layout">
        <aside class="spot-list-panel">
          <div class="panel-heading"><span><b id="spotCount">0</b>개의 포인트</span><button id="clearSaved" class="icon-text">저장 목록 해제</button></div>
          <div id="spotList" class="spot-list"></div>
        </aside>
        <div class="map-wrap"><div id="map" aria-label="세계 다이빙 지도"></div><div class="map-legend"><span><i class="dot beginner"></i>초급</span><span><i class="dot intermediate"></i>중급</span><span><i class="dot advanced"></i>상급</span></div></div>
      </section>
      <section id="detailCard" class="detail-card empty"><p>지도 마커 또는 포인트를 선택하면 자세한 다이빙 정보를 볼 수 있어요.</p></section>
    </section>

    <section id="logbookView" class="view">
      <div class="logbook-head"><div><p class="eyebrow">MY UNDERWATER STORY</p><h2>다이빙 <em>로그북</em></h2><p>기억은 기록할수록 선명해집니다.</p></div><button id="addLogButton" class="primary-button">+ 새 로그 추가</button></div>
      <section class="stats" id="logStats"></section>
      <section class="logbook-tools"><button id="exportLogs" class="outline-button">↓ JSON 내보내기</button><label class="outline-button">↑ JSON 가져오기<input id="importLogs" type="file" accept="application/json" hidden /></label></section>
      <section id="logList" class="log-grid"></section>
      <p id="emptyLogs" class="empty-state">아직 기록된 다이빙이 없습니다. 첫 번째 추억을 남겨보세요.</p>
    </section>
  </main>

  <dialog id="logDialog"><form id="logForm" method="dialog"><div class="dialog-head"><h3 id="dialogTitle">새 다이빙 로그</h3><button type="button" class="close-dialog" aria-label="닫기">×</button></div><input id="logId" type="hidden" /><div class="form-grid"><label>다이빙 포인트<input id="logSpot" required placeholder="예: Kona, Hawaii" /></label><label>다이빙 날짜<input id="logDate" type="date" required /></label><label>다이브 번호<input id="logNumber" type="number" min="1" placeholder="1" /></label><label>최대 수심 (m)<input id="logDepth" type="number" min="0" step="0.1" /></label><label>다이빙 시간 (분)<input id="logDuration" type="number" min="0" /></label><label>버디<input id="logBuddy" placeholder="버디 이름" /></label></div><label>한 줄 메모<textarea id="logNote" rows="4" placeholder="오늘의 바다는 어땠나요?"></textarea></label><div class="dialog-actions"><button type="button" class="outline-button close-dialog">취소</button><button class="primary-button" value="default">저장하기</button></div></form></dialog>
  <template id="spotTemplate"><article class="spot-item"><button class="spot-main"><span class="difficulty-mark"></span><span><b></b><small></small></span></button><div class="spot-actions"><button class="wish-btn" title="가고 싶은 곳">♡</button><button class="visited-btn" title="다녀온 곳">✓</button></div></article></template>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
